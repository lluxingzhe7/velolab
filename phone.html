<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>VeloLab · 手机摄像头</title>
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#0a0e13;--lime:#c9f25c;--ink:#eef4ff;--muted:#8fa0b6;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.01em;font-size:14px}
.mark{width:26px;height:26px;border-radius:8px;background:#132033;color:var(--lime);display:grid;place-items:center;font-weight:800;font-size:13px}
.head-right{display:flex;align-items:center;gap:8px}
.state{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.state i{width:7px;height:7px;border-radius:50%;background:#c3cbd8;display:block}
.state.on{color:var(--lime)} .state.on i{background:var(--lime);box-shadow:0 0 0 3px rgba(201,242,92,.18)}
.rotate{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);
  border-radius:9px;padding:6px 10px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer}
main{position:relative;flex:1;min-height:0;background:#05070a;overflow:hidden}
#preview{width:100%;height:100%;object-fit:contain;display:block;background:#05070a}
#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hint{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(8,12,17,.74);border:1px solid var(--line);
  border-radius:12px;padding:9px 11px;font-size:12px;line-height:1.55;color:#cfdae9;backdrop-filter:blur(10px)}
.hint b{color:var(--lime)}
.hint.dim{opacity:.35}
.controls{padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.settings{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.camrow{display:flex;align-items:center;gap:7px;flex:1 1 100%}
.field{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);min-width:0}
.field.grow{flex:1 1 auto}
.field.zm{flex:1 1 150px}
.field span{white-space:nowrap}
select{flex:1;min-width:0;background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line);
  border-radius:9px;padding:7px 8px;font-size:12.5px;font-family:inherit}
input[type=range]{flex:1;min-width:60px;accent-color:#9bbf3d;height:24px}
.field b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:12.5px;min-width:38px;text-align:right}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);border-radius:8px;
  padding:5px 8px;font-size:11.5px;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:1.2}
.chip:disabled{opacity:.4}
.chip.on{background:rgba(201,242,92,.18);border-color:rgba(201,242,92,.5);color:var(--lime)}
.zchips{display:flex;gap:6px;flex:none}
.cam-note{margin:0;font-size:11.5px;line-height:1.6;color:#9fb0c6;border-left:2px solid rgba(201,242,92,.45);padding:6px 0 6px 8px}
.cam-note b{color:var(--lime)}
.cam-note[hidden]{display:none}
.buttons{display:flex;gap:8px}
button.act{flex:1;border:0;border-radius:12px;padding:12px 10px;font-size:14px;font-weight:700;font-family:inherit;
  background:rgba(255,255,255,.1);color:var(--ink);cursor:pointer;white-space:nowrap}
button.act.primary{background:var(--lime);color:#1c2a06}
button.act:disabled{opacity:.45}
.note{padding:0 12px calc(8px + env(safe-area-inset-bottom));font-size:11px;color:#6d7d93;line-height:1.6}
/* 横屏：控制条压成一条半透明浮层，画面吃满整屏 */
@media (orientation: landscape){
  header{padding:6px 12px}
  .brand span.name{display:none}
  main{min-height:0}
  #preview{object-fit:contain}
  .controls{position:absolute;left:0;right:0;bottom:0;z-index:3;border-top:1px solid rgba(255,255,255,.14);
    background:linear-gradient(to top,rgba(6,9,13,.92),rgba(6,9,13,.55));padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap}
  .settings{flex:1 1 auto;min-width:0;gap:14px;flex-wrap:nowrap}
  .camrow{flex:0 1 230px}
  .field.grow select{max-width:190px}
  .field.zm{flex:1 1 130px}
  .buttons{flex:0 0 auto}
  button.act{flex:0 0 auto;padding:9px 16px;font-size:13.5px}
  .hint{left:auto;right:12px;bottom:96px;max-width:52%}
  .cam-note{flex:1 1 100%;order:9;font-size:11px;padding:4px 0 4px 8px}
  .note{display:none}
}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="mark">V</div><span class="name">VeloLab 手机摄像头</span></div>
  <div class="head-right">
    <div class="state" id="state"><i></i><span>未连接</span></div>
    <button id="btn-rotate" class="rotate" type="button">横屏</button>
  </div>
</header>
<main>
  <video id="preview" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  <div class="hint" id="hint">点下方「开始推流」，画面会实时出现在电脑上，电脑算出的角度和调整建议会显示在这里。</div>
</main>
<div class="controls">
  <div class="settings">
    <div class="camrow">
      <label class="field grow"><span>镜头</span><select id="cam-select"><option value="">自动</option></select></label>
      <button id="btn-rescan" class="chip" type="button" title="重新扫描镜头">↻</button>
    </div>
    <div class="zchips">
      <button id="btn-wide" class="chip on" type="button">最广</button>
      <button id="btn-1x" class="chip" type="button">1×</button>
    </div>
    <div class="zchips">
      <button id="btn-ar169" class="chip on" type="button">16:9</button>
      <button id="btn-ar43" class="chip" type="button">4:3</button>
    </div>
    <label class="field zm"><span>变焦</span><input id="zoom" type="range" min="1" max="3" step="0.1" value="1"><b id="zoom-val">1.0×</b></label>
  </div>
  <p class="cam-note" id="cam-note" hidden></p>
  <div class="buttons">
    <button id="btn-start" class="act primary" type="button">开始推流</button>
    <button id="btn-stop" class="act" type="button" disabled>停止</button>
  </div>
</div>
<div class="note" id="note">房间小就把手机横过来贴墙放：镜头降到车把高度、整车（含脚最低点）入镜。手机若开放了超广角，点「最广」或看镜头下拉里带 0.5× 的那项。</div>
<script type="module" src="./src/phone.js"></script>
</body>
</html>
